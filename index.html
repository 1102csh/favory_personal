<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAVORY</title>

  <!-- index.html의 <head> 안 -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('app:theme-preference') || 'system';
        if (pref !== 'system') {
          document.documentElement.setAttribute('data-theme', pref);
        }
      } catch (e) { }
    })();
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
